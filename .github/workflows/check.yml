name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.13'
          actions-cache-folder: emsdk-cache
      - run: npm ci
      # Use the hosted image's Chromium system libraries; install Playwright's pinned browser.
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: crtvd-release
          path: |
            dist/
            release/
            build/native-release/crtvd
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
