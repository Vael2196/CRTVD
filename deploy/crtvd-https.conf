# Host Nginx; no upstream port or application container is needed.
server {
    listen 80;
    server_name crtvd.vaell.dev;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://crtvd.vaell.dev$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name crtvd.vaell.dev;
    ssl_certificate /etc/letsencrypt/live/crtvd.vaell.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crtvd.vaell.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/projects/crtvd/current;
    index index.html;
    access_log /var/log/nginx/crtvd.access.log;
    error_log /var/log/nginx/crtvd.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;

    # Hashed Vite chunks are immutable and shared across retained releases.
    location ^~ /assets/ {
        alias /srv/projects/crtvd/shared/assets/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    # Fixed loader/binary paths must revalidate together after a release.
    location ~ \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
    }
    # Missing scripts must return 404, never the SPA HTML fallback.
    location ~* \.(?:js|mjs|css|json|png|jpg|jpeg|gif|svg|ico|txt|html)$ {
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
