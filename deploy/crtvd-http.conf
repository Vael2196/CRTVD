# Bootstrap HTTP site. Install this before requesting the hostname certificate.
server {
    listen 80;
    server_name crtvd.vaell.dev;
    root /srv/projects/crtvd/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
